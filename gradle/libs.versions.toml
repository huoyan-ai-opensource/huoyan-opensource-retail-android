[versions]
androidxWorkWorkRuntime = "2.8.1"
recyclerview = "1.2.1"
# 保持移除 zxing-android-embedded 前实际解析到的条码库版本。
core = "3.4.1"
eventbus = "3.1.1"
fastjson = "1.2.47"
gradle = "7.4.2"
gson = "2.11.0"
javaWebsocket = "1.5.2"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
kotlinStdlib = "1.8.20"
appcompat = "1.3.1"
material = "1.4.0"
constraintlayout = "2.1.4"
okhttp3 = "4.10.0"
xcrash = "3.0.0"

[libraries]
androidx-work-work-runtime3 = { module = "androidx.work:work-runtime", version.ref = "androidxWorkWorkRuntime" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
core = { module = "com.google.zxing:core", version.ref = "core" }
eventbus = { module = "org.greenrobot:eventbus", version.ref = "eventbus" }
fastjson = { module = "com.alibaba:fastjson", version.ref = "fastjson" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "javaWebsocket" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlinStdlib" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp3" }
xcrash = { module = "com.iqiyi.xcrash:xcrash-android-lib", version.ref = "xcrash" }
